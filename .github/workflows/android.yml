name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The build only reads the repository: Gradle and its dependencies get no write permission.
# Only the separate job below can write (publish a release), and only on the main branch or a tag.
permissions:
  contents: read

# Fingerprint of the certificate the island has been signed with since 1.6.1. If the secret is swapped for a different key,
# the build stops: otherwise updates would stop installing for everyone.
env:
  SIGNING_CERT_SHA256: c691aa99b1d38518d066066fcb31664374f6a21d65180f7c0565c37a073a12dd

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      release: ${{ steps.ver.outputs.release }}
      update: ${{ steps.ver.outputs.update }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A release goes out by itself when versionName is raised in app/build.gradle.kts
      # (or when a v* tag is pushed). The description is in two languages: CHANGELOG.en.md and CHANGELOG.md.
      # If a release for this version already exists, a push to the main branch updates its description.
      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          v=$(grep -oP 'versionName = "\K[0-9A-Za-z.\-]+(?=")' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$v"; fi
          # The tag goes into the release name and into commands, so only letters, digits, dots and hyphens
          if [[ ! "$tag" =~ ^v[0-9A-Za-z.\-]+$ ]]; then echo "Unexpected tag: $tag" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          exists=false
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exists=true
          release=false
          update=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            if [[ "$exists" == true ]]; then update=true; else release=true; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"

      # Gradle builds an unsigned APK: it doesn't need the key, and third-party build code won't see it
      - name: Build
        run: ./gradlew --no-daemon --max-workers=4 testDebugUnitTest lintDebug assembleRelease

      # Signing is a separate step: the key from secrets exists only here and is deleted right away
      - name: Sign
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE: ${{ steps.ver.outputs.release }}
          UPDATE: ${{ steps.ver.outputs.update }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            if [[ "$RELEASE" == true || "$UPDATE" == true ]]; then
              echo "::error::Missing secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD — unsigned releases are not published"
              exit 1
            fi
            echo "::notice::No signing secrets (e.g. a pull request from a fork) — APK built but not signed or published"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ks="$RUNNER_TEMP/island.p12"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          # First, check that the key in the secret is the right one
          info=$(keytool -list -v -keystore "$ks" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD -alias island)
          key=$(awk -F'SHA256: *' 'NF > 1 {gsub(":", "", $2); print tolower($2); exit}' <<<"$info")
          if [[ "$key" != "$SIGNING_CERT_SHA256" ]]; then
            echo "::error::KEYSTORE_BASE64 holds a different key ($key) — expected $SIGNING_CERT_SHA256"
            exit 1
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $bt"
          mkdir -p out
          "$bt/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias island \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out out/DynamicIsland.apk "$RUNNER_TEMP/aligned.apk"
          # Then, check that the APK is signed with exactly that key (the certificate isn't secret, it's visible in the log)
          certs=$("$bt/apksigner" verify --verbose --print-certs out/DynamicIsland.apk)
          echo "$certs"
          got=$(awk 'tolower($0) ~ /certificate sha-256 digest:/ {print tolower($NF); exit}' <<<"$certs")
          if [[ "$got" != "$SIGNING_CERT_SHA256" ]]; then
            echo "::error::APK is signed with the wrong key ($got) — expected $SIGNING_CERT_SHA256"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Test APKs are kept for a week and then disappear on their own; versions for everyone are in the releases
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: DynamicIsland-apk
          path: out/DynamicIsland.apk
          retention-days: 7

  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && (needs.build.outputs.release == 'true' || needs.build.outputs.update == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: DynamicIsland-apk
          path: out

      - name: Release notes from CHANGELOG.en.md and CHANGELOG.md
        run: |
          v="${TAG#v}"
          section() { awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' "$1"; }
          {
            echo "## 🇬🇧 English"
            section CHANGELOG.en.md
            printf '\n**Install:** download `DynamicIsland.apk` below and open it on your phone. A new version installs over the old one, your settings are kept. **Coming from 1.6.0 or older:** uninstall the old version first — once, because the app now has a new signing key.\n\n---\n\n'
            echo "## 🇷🇺 Русский"
            section CHANGELOG.md
            printf '\n**Установка:** скачайте `DynamicIsland.apk` ниже и откройте на телефоне. Новая версия ставится поверх старой, настройки сохраняются. **С версии 1.6.0 и старше:** сначала удалите старую версию — один раз, потому что у приложения новый ключ подписи.\n'
          } > notes.md
          cat notes.md

      # gh itself publishes the release, with no third-party actions that would have to be trusted with write access
      - name: Release
        if: needs.build.outputs.release == 'true'
        run: |
          gh release create "$TAG" out/DynamicIsland.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dynamic Island $TAG · Динамический остров" --notes-file notes.md --latest

      - name: Update notes of the published release
        if: needs.build.outputs.update == 'true'
        run: |
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md --title "Dynamic Island $TAG · Динамический остров"
